<!doctype html>
<html lang="en" data-theme="dark" data-skin="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lucide — a browser-style home for AI, education and more." />
    <title>Home</title>
    <link rel="icon" type="image/svg+xml" href="./assets/mark.svg" />
    <link rel="preload" href="./assets/fonts/lucide-obfuscated.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/fonts/lucide-obfuscated-display.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <div class="sidebar-controls">
            <button class="icon-btn" id="backBtn" type="button" aria-label="Back" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
            </button>
            <button class="icon-btn" id="forwardBtn" type="button" aria-label="Forward" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
            <button class="icon-btn" id="reloadBtn" type="button" aria-label="Reload" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></svg>
            </button>
            <button class="icon-btn collapse-btn" id="collapseBtn" type="button" aria-label="Collapse sidebar">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /></svg>
            </button>
          </div>

          <form class="side-omnibox" id="sideSearch" autocomplete="off">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
            <input id="sideSearchInput" type="text" placeholder="Search or enter URL" spellcheck="false" aria-label="Search or enter URL" />
          </form>

          <div class="bookmarks" id="bookmarks" aria-label="Bookmarks"></div>

          <button class="newtab-row" id="newTabBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            <span>New tab</span>
          </button>

          <div class="tab-list" id="tabList" role="list"></div>
        </div>

        <nav class="sidebar-nav" id="nav" aria-label="Main"></nav>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <form class="omnibox" id="topSearch" autocomplete="off">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
            <input id="topSearchInput" type="text" placeholder="Search or enter URL" spellcheck="false" aria-label="Search or enter URL" />
          </form>
        </header>

        <main class="viewport" id="viewport">
          <div class="background" id="background" aria-hidden="true">
            <div class="veil veil-a"></div>
            <div class="veil veil-b"></div>
            <div class="veil veil-c"></div>
            <div class="veil grain"></div>
          </div>
          <div class="page" id="page"></div>
        </main>
      </div>
    </div>

    <div class="sidebar-scrim" id="sidebarScrim" hidden></div>

    <section class="plus-toast" id="plusToast" hidden aria-label="Lucide Plus">
      <button class="plus-toast-close" id="plusToastClose" type="button" aria-label="Dismiss">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
      <span class="plus-toast-title">Lucide Plus</span>
      <p class="plus-toast-body">Go ad-free, unlock 1,500 AI messages/day, and get exclusive links.</p>
      <button class="plus-toast-cta" id="plusToastCta" type="button">Learn more</button>
    </section>

    <div class="modal-backdrop" id="modalRoot" hidden></div>
    <div class="toast-stack" id="toastStack" aria-live="polite"></div>

    <footer class="site-credit" id="siteCredit">
      <a class="site-credit-link" data-credit href="https://discord.gg/" target="_blank" rel="noopener noreferrer">recreated by goz!</a>
    </footer>

    <script src="./config.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
